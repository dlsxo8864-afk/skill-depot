<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>스킬 창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --floor: #E7E8E3;
  --shelf: #FBFBF8;
  --soft: #F0F1EC;
  --ink: #1B2130;
  --ink2: #5A6170;
  --line: #C8CAC2;
  --tape: #FFD400;
  --tape-ink: #1B2130;
  --stamp: #1E46C8;
  --sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: "IBM Plex Mono", "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --floor: #14171D;
    --shelf: #1C2029;
    --soft: #252A35;
    --ink: #ECEDE8;
    --ink2: #A3A9B5;
    --line: #383D4A;
    --stamp: #9DB2FF;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--floor);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--stamp); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
code, .mono { font-family: var(--mono); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* 머리 */
.top { padding: 44px 0 22px; }
.top h1 { margin: 0; font-size: 46px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
.top p { margin: 10px 0 0; max-width: 38em; color: var(--ink2); }

/* 노란 띠: CLI 에 건넬 한 줄 */
.tape { position: relative; background: var(--tape); color: var(--tape-ink); }
.tape::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 30px;
  background: repeating-linear-gradient(135deg, var(--tape-ink) 0 9px, transparent 9px 18px);
}
.tape .wrap { padding-top: 20px; padding-bottom: 22px; padding-left: 54px; }
.tape-say { margin: 0 0 6px; font-size: 15px; font-weight: 500; }
.tape-line { display: flex; gap: 14px; align-items: flex-start; }
.tape-line code { flex: 1; min-width: 0; font-size: 21px; line-height: 1.45; font-weight: 500; overflow-wrap: anywhere; }
.copy {
  flex: none; border: 1.5px solid currentColor; background: transparent; border-radius: 4px;
  padding: 5px 14px; font-size: 14px; font-weight: 600; line-height: 1.5; white-space: nowrap;
}
.copy:hover { background: var(--ink); color: var(--shelf); border-color: var(--ink); }
.tape .copy:hover { background: var(--tape-ink); color: var(--tape); border-color: var(--tape-ink); }
.copy.done { background: var(--ink); color: var(--shelf); border-color: var(--ink); }
.tape .copy.done { background: var(--tape-ink); color: var(--tape); border-color: var(--tape-ink); }

/* 고르기 */
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 26px 0 10px; }
.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--shelf); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 15px; border-left: 1px solid var(--line); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--shelf); font-weight: 600; }
.seg button .n { font-weight: 400; opacity: .65; margin-left: 5px; font-size: 13px; }
.seg.small button { padding: 3px 10px; font-size: 13px; }
.search { flex: 1; min-width: 200px; }
.search input {
  width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--shelf);
  padding: 7px 12px; font-size: 15px;
}
.basis { margin: 0 0 18px; font-size: 13px; color: var(--ink2); }

/* 묶음 */
.packs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-bottom: 22px; }
.pack { min-width: 0; background: var(--shelf); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px 14px; }
.pack-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.pack-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.pack-head .meta { font-size: 14px; color: var(--ink2); }
.pack-head .copy { margin-left: auto; }
.strip { display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: thin; }
.frame { flex: 1 0 56px; max-width: 84px; border: 0; background: transparent; padding: 0; text-align: left; }
.frame img, .frame .paper { width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 4px; }
.frame img { display: block; object-fit: cover; background: var(--soft); }
.frame .cap { display: block; margin-top: 5px; font-size: 12px; line-height: 1.35; color: var(--ink2); }
.frame:hover .cap { color: var(--ink); }

/* 목록 */
.list { list-style: none; margin: 0 0 40px; padding: 0; background: var(--shelf); border: 1px solid var(--line); border-radius: 6px; }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-head {
  display: grid; grid-template-columns: 46px minmax(0, 1fr) 150px 118px; gap: 0 18px; align-items: center;
  width: 100%; border: 0; background: transparent; text-align: left; padding: 13px 18px;
}
.row-head:hover { background: var(--soft); }
.row.open > .row-head { background: var(--soft); }
.thumb { width: 46px; height: 62px; border-radius: 3px; object-fit: cover; object-position: center 30%; background: var(--soft); display: block; }
.paper {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 46px; height: 62px; border: 1px solid var(--line); border-radius: 3px; background: var(--shelf);
  font-size: 11px; line-height: 1.2; color: var(--ink2);
}
.paper b { font-size: 17px; font-weight: 600; color: var(--ink); }
.paper.out { border-style: dashed; background: transparent; }
.what .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.what .title { font-size: 18px; font-weight: 600; line-height: 1.35; }
.what .id { font-family: var(--mono); font-size: 13px; color: var(--ink2); }
.what .sum { margin: 2px 0 0; font-size: 15px; color: var(--ink2); line-height: 1.5; }
.tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink2); white-space: nowrap; }
.tag.need { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); font-weight: 500; }
.use { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.use .bar { flex: 1; height: 8px; background: var(--soft); border-radius: 1px; overflow: hidden; }
.row-head:hover .use .bar, .row.open .use .bar { background: var(--line); }
.use .bar i { display: block; height: 100%; background: var(--ink); }
.use b { flex: none; min-width: 42px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.use.none { color: var(--ink2); }
.use.none b { font-weight: 400; min-width: 0; }
.when { font-size: 13px; color: var(--ink2); line-height: 1.5; font-variant-numeric: tabular-nums; }
.when span { display: block; }

/* 펼친 칸 */
.panel { padding: 6px 18px 24px 82px; }
.panel-grid { display: grid; gap: 24px; }
.panel-grid.has-visual { grid-template-columns: 240px minmax(0, 1fr); align-items: start; }
.visual video, .visual img { display: block; width: 100%; border-radius: 5px; background: #000; }
.visual .hint { margin: 6px 0 0; font-size: 12px; color: var(--ink2); }
.desc { margin: 0 0 14px; max-width: 44em; }
.desc-src { margin: -6px 0 14px; max-width: 52em; font-size: 13px; color: var(--ink2); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 0 0 16px; font-size: 14px; }
.facts dt { color: var(--ink2); }
.facts dd { margin: 0; }
.needs { margin: 0 0 16px; padding: 10px 14px; border-left: 4px solid var(--tape); background: var(--soft); font-size: 14px; }
.needs strong { font-weight: 600; }
.needs ul { margin: 4px 0 0; padding-left: 18px; }
.get h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.cmd { margin: 0 0 12px; }
.cmd-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 5px; font-size: 13px; color: var(--ink2); }
.cmd-box { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 5px; background: var(--shelf); padding: 9px 10px 9px 12px; }
.cmd-box code { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.cmd-box .copy { padding: 2px 10px; font-size: 13px; }
.cmd-note { margin: 5px 0 0; font-size: 13px; color: var(--ink2); }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; font-size: 14px; }
details.files { margin: 14px 0 0; font-size: 14px; }
details.files summary { cursor: pointer; color: var(--ink2); }
details.files ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--shelf); }
details.files li { display: flex; justify-content: space-between; gap: 16px; padding: 3px 12px; font-family: var(--mono); font-size: 12.5px; }
details.files li + li { border-top: 1px solid var(--soft); }
details.files li span { color: var(--ink2); flex: none; }

/* 문서 미리보기 */
.doc { margin-top: 22px; border: 1px solid var(--line); border-radius: 5px; background: var(--shelf); }
.doc-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.doc-body { position: relative; padding: 4px 22px 18px; max-height: 420px; overflow: hidden; font-size: 15px; }
.doc.all .doc-body { max-height: none; }
.doc:not(.all) .doc-body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: linear-gradient(transparent, var(--shelf)); pointer-events: none; }
.doc-more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 8px; font-size: 14px; font-weight: 500; }
.doc-more:hover { background: var(--soft); }
.md h1, .md h2, .md h3, .md h4 { margin: 20px 0 6px; line-height: 1.35; font-weight: 600; }
.md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; } .md h4 { font-size: 15px; }
.md p { margin: 8px 0; max-width: 46em; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; max-width: 46em; }
.md li { margin: 3px 0; }
.md code { font-size: .88em; background: var(--soft); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.md pre { margin: 10px 0; padding: 10px 12px; background: var(--soft); border-radius: 4px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--soft); font-weight: 600; }
.md blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--ink2); }

/* 모음 고르기 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 26px 0 0; }
.chips button { border: 1px solid var(--line); background: var(--shelf); border-radius: 5px; padding: 7px 13px; font-size: 15px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--shelf); border-color: var(--ink); font-weight: 600; }
.chips button .n { font-weight: 400; opacity: .65; margin-left: 5px; font-size: 13px; }
.chips + .basis { margin: 12px 0 0; max-width: 60em; }
.chips ~ .controls { padding: 14px 0 18px; }
#cats { border: 1px solid var(--line); border-radius: 5px; background: var(--shelf); padding: 7px 10px; font: inherit; font-size: 15px; color: inherit; max-width: 100%; }
.points { margin: 0 0 14px; padding: 0; list-style: none; font-size: 14px; max-width: 46em; }
.points li { padding-left: 4.6em; text-indent: -4.6em; margin: 3px 0; }
.points li b { display: inline-block; width: 4.6em; text-indent: 0; font-weight: 500; color: var(--ink2); }
.how { margin: 0 0 14px; padding: 10px 14px; background: var(--soft); border-radius: 5px; font-size: 14px; max-width: 46em; }
.how strong { font-weight: 600; }

/* 긴 라이선스 문구·주소가 칸을 밀어내지 않게 */
.row-head > * { min-width: 0; }
.use.none b { flex: 1 1 auto; overflow-wrap: anywhere; }
.what .title, .what .sum, .desc, .desc-src, .how, .points li, .facts dd, .links a, .cmd-note, .when span { overflow-wrap: anywhere; }
.facts { grid-template-columns: max-content minmax(0, 1fr); }

.empty { padding: 34px 18px; color: var(--ink2); }
.foot { padding: 0 0 48px; font-size: 13px; color: var(--ink2); }
.foot a { color: inherit; }

@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .top { padding-top: 30px; }
  .top h1 { font-size: 36px; }
  .controls .seg button { padding: 7px 9px; font-size: 14px; }
  .controls .seg button .n { margin-left: 3px; }
  .tape::before { width: 16px; }
  .tape .wrap { padding-left: 30px; }
  .tape-line { flex-direction: column; gap: 10px; }
  .tape-line code { font-size: 17px; }
  .row-head { grid-template-columns: 46px minmax(0, 1fr); gap: 8px 14px; padding: 12px 14px; }
  .use, .when { grid-column: 2; }
  .when span { display: inline; margin-right: 12px; }
  .panel { padding: 6px 14px 20px; }
  .panel-grid.has-visual { grid-template-columns: 1fr; }
  .visual { max-width: 220px; }
  .pack-head .copy { margin-left: 0; }
}
</style>
</head>
<body>

<header class="top wrap">
  <h1>스킬 창고</h1>
  <p>새 PC나 다른 CLI에서도 이 주소만 알려 주면, 여기 있는 스킬을 받아 씁니다.</p>
</header>

<section class="tape" aria-label="CLI에 건넬 말">
  <div class="wrap">
    <p class="tape-say">CLI에 이 말을 붙여 넣으세요</p>
    <div class="tape-line">
      <code id="say"></code>
      <button class="copy" type="button" data-copy-from="say">복사</button>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="chips" id="groups" role="group" aria-label="모음"></div>
  <p class="basis" id="basis"></p>
  <div class="controls">
    <select id="cats" aria-label="분류" hidden></select>
    <div class="seg" id="sorts" role="group" aria-label="순서">
      <button type="button" data-sort="usage">많이 쓴 순</button>
      <button type="button" data-sort="recent">최근 배운 순</button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="이름이나 설명으로 찾기" aria-label="스킬 찾기"></label>
  </div>
  <div class="packs" id="packs"></div>
  <ul class="list" id="list"></ul>
</main>

<footer class="foot wrap" id="foot"></footer>

<script>
(() => {
  "use strict";

  // 사이트 주소: 빌드할 때 박힌 값이 있으면 그것, 없으면 지금 열린 주소
  const EMBEDDED = "https://dlsxo8864-afk.github.io/skill-depot";
  const BASE = (EMBEDDED && !EMBEDDED.startsWith("__"))
    ? EMBEDDED.replace(/\/$/, "")
    : location.href.replace(/[#?].*$/, "").replace(/index\.html$/, "").replace(/\/$/, "");

  let GROUPS = [];        // catalog.collections 에서 채운다
  let colById = {};
  const KIND_TAG = { command: "명령어", bundle: "스킬 묶음 zip", external: "원본에서 받기", builtin: "앱에 들어 있음" };
  const AGENT_NAME = { claude: "Claude Code", codex: "Codex" };

  const store = {
    get(k, d) { try { return localStorage.getItem("depot." + k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("depot." + k, v); } catch (e) { /* 저장 못 해도 그대로 동작 */ } },
  };
  const state = {
    group: "mine", category: "", sort: "usage", q: "", open: null,
    os: store.get("os", /Win/i.test(navigator.platform || navigator.userAgent) ? "win" : "sh"),
    agent: store.get("agent", "claude"),
  };
  let cat = null;
  let byName = {};
  let maxCalls = 1;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 작은 도구 ----------
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of [].concat(kids || [])) if (c != null) n.append(c);
    return n;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function size(b) {
    if (b >= 1048576) return (b / 1048576).toFixed(1) + "MB";
    if (b >= 1024) return Math.round(b / 1024) + "KB";
    return b + "B";
  }
  function day(s) {
    if (!s) return "";
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m ? `${+m[2]}월 ${+m[3]}일` : s;
  }
  function copyText(text, btn) {
    const done = () => {
      const old = btn.dataset.label || btn.textContent;
      btn.dataset.label = old;
      btn.textContent = "복사됨";
      btn.classList.add("done");
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
    };
    const fallback = () => {
      const ta = el("textarea", { style: "position:fixed;left:-9999px;top:0" });
      ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { btn.textContent = "복사 안 됨 — 직접 선택하세요"; }
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  const copyBtn = (getText, label) => el("button", {
    class: "copy", type: "button", text: label || "복사",
    onclick: (e) => { e.stopPropagation(); copyText(getText(), e.currentTarget); },
  });

  // ---------- 명령 문장 ----------
  const sayAll = () => `${BASE}/llms.txt 를 읽고 필요한 스킬을 설치해 줘`;
  function sayFor(target, noun) { return `${BASE}/llms.txt 를 읽고 ${target} ${noun}을 설치해 줘`; }
  function installCmd(target, agent, os) {
    return os === "win"
      ? `iwr ${BASE}/install.ps1 -OutFile $env:TEMP\\depot.ps1; powershell -ExecutionPolicy Bypass -File $env:TEMP\\depot.ps1 ${target} -Agent ${agent} -Base ${BASE}`
      : `curl -fsSL ${BASE}/install.sh | bash -s -- ${target} --agent ${agent} --base ${BASE}`;
  }

  // ---------- 마크다운(작게) ----------
  function inline(s, rawBase) {
    let t = esc(s);
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
      const h = href.replace(/&amp;/g, "&");
      if (/^(javascript|data|vbscript):/i.test(h)) return text;
      const url = /^(https?:|#|mailto:)/i.test(h) ? h : (rawBase || "") + h.replace(/^\.\//, "");
      return `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`;
    });
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
  }
  function md(src, rawBase) {
    const lines = src.replace(/\r\n?/g, "\n").replace(/^---\n[\s\S]*?\n---\n?/, "").split("\n");
    const out = [];
    let i = 0, para = [];
    const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "), rawBase)}</p>`); para = []; } };
    while (i < lines.length) {
      const ln = lines[i];
      if (/^\s*```/.test(ln)) {
        flush();
        const buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
        continue;
      }
      const h = /^(#{1,6})\s+(.*)$/.exec(ln);
      if (h) { flush(); const lv = Math.min(4, h[1].length); out.push(`<h${lv}>${inline(h[2], rawBase)}</h${lv}>`); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i + 1])) {
        flush();
        const cells = (r) => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
        let t = "<table><thead><tr>" + cells(ln).map((c) => `<th>${inline(c, rawBase)}</th>`).join("") + "</tr></thead><tbody>";
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          t += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c, rawBase)}</td>`).join("") + "</tr>"; i++;
        }
        out.push(t + "</tbody></table>");
        continue;
      }
      if (/^\s*([-*]|\d+[.)])\s+/.test(ln)) {
        flush();
        const ordered = /^\s*\d+[.)]\s+/.test(ln);
        const items = [];
        while (i < lines.length && (/^\s*([-*]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          const m = /^\s*([-*]|\d+[.)])\s+(.*)$/.exec(lines[i]);
          if (m) items.push(m[2]); else items[items.length - 1] += " " + lines[i].trim();
          i++;
        }
        out.push(`<${ordered ? "ol" : "ul"}>` + items.map((x) => `<li>${inline(x, rawBase)}</li>`).join("") + `</${ordered ? "ol" : "ul"}>`);
        continue;
      }
      if (/^\s*>/.test(ln)) {
        flush();
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
        out.push(`<blockquote><p>${inline(buf.join(" "), rawBase)}</p></blockquote>`);
        continue;
      }
      if (/^\s*$/.test(ln)) { flush(); i++; continue; }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { flush(); i++; continue; }
      para.push(ln.trim()); i++;
    }
    flush();
    return out.join("\n");
  }

  // ---------- 그리기 ----------
  function thumbFor(it, big) {
    const p = it.preview || {};
    const poster = p.type === "video" ? p.poster : (p.type === "image" ? p.src : null);
    if (poster) return el("img", { class: big ? null : "thumb", src: poster, alt: "", loading: "lazy" });
    if (it.kind === "bundle") return el("span", { class: "paper" }, [el("b", { text: "zip" }), size(it.zip.bytes)]);
    if (it.zip) return el("span", { class: "paper" }, [el("b", { text: String(it.file_count) }), "파일"]);
    return el("span", { class: "paper out", text: it.group === "builtin" ? "기본" : (it.imported ? "링크" : "외부") });
  }

  function visible() {
    const q = state.q.trim().toLowerCase();
    let items = cat.items.filter((it) => state.group === "all" || it.group === state.group);
    if (state.category) items = items.filter((it) => it.category === state.category);
    if (q) items = items.filter((it) => [it.name, it.title, it.summary, it.description, it.license, (it.source || {}).label].join(" ").toLowerCase().includes(q));
    // 모아 둔 목록은 모은 순서(분류 순)를 그대로 둔다
    if (isImported(state.group)) return items;
    const recent = (it) => it.added || "";
    return items.slice().sort((a, b) => state.sort === "usage"
      ? (b.usage.calls - a.usage.calls) || recent(b).localeCompare(recent(a)) || (a._i - b._i)
      : recent(b).localeCompare(recent(a)) || (b.usage.calls - a.usage.calls) || (a._i - b._i));
  }

  const isImported = (group) => !!(colById[group] && colById[group].imported);

  function renderControls() {
    const g = $("groups");
    g.replaceChildren(...GROUPS.map((x) => el("button", {
      type: "button", "aria-pressed": String(state.group === x.id),
      onclick: () => { state.group = x.id; state.category = ""; state.open = null; render(); },
    }, [x.label, el("span", { class: "n", text: String(x.count) })])));

    // 모음 설명
    const col = colById[state.group];
    const w = cat.usage_window;
    let text = col ? col.desc : "받을 수 있는 것과 목록만 있는 것을 모두 보여 줍니다.";
    if (col && col.imported) {
      text += ` ${col.source || ""}${col.collected ? ", " + col.collected + " 수집" : ""}. 라이선스는 쓰기 전에 원문을 다시 확인하세요.`;
    } else if (w && w.from) {
      text += ` 사용 횟수는 ${w.from}부터 ${w.to}까지의 대화 기록에서 셌습니다(Claude는 스킬을 부른 횟수, Codex는 스킬 문서를 연 대화 수).`;
    }
    $("basis").textContent = text;

    // 분류 고르기(분류가 있는 모음에서만)
    const sel = $("cats");
    const cats = col && col.categories ? col.categories : [];
    sel.hidden = cats.length === 0;
    sel.replaceChildren(
      el("option", { value: "", text: `모든 분류 (${col ? col.count : 0})` }),
      ...cats.map((c) => el("option", { value: c.id, text: `${c.label} (${c.count})` })),
    );
    sel.value = state.category;

    $("sorts").hidden = isImported(state.group);
    for (const b of $("sorts").children) b.setAttribute("aria-pressed", String(b.dataset.sort === state.sort));
  }

  function renderPacks() {
    const box = $("packs");
    const show = (state.group === "mine" || state.group === "all") && !state.q.trim();
    box.hidden = !show;
    if (!show) { box.replaceChildren(); return; }
    box.replaceChildren(...cat.packs.map((p) => {
      const members = p.items.map((n) => byName[n]).filter(Boolean);
      const target = "pack:" + p.id;
      return el("section", { class: "pack" }, [
        el("div", { class: "pack-head" }, [
          el("h2", { text: p.title }),
          el("span", { class: "meta", text: `한 번에 받기, zip 합계 ${size(p.bytes)}` }),
          copyBtn(() => sayFor(target, "묶음"), "CLI에 시킬 말 복사"),
        ]),
        el("div", { class: "strip" }, members.map((it) => el("button", {
          class: "frame", type: "button", title: it.summary,
          onclick: () => openItem(it.name, true),
        }, [thumbFor(it, true), el("span", { class: "cap", text: it.title })]))),
      ]);
    }));
  }

  function renderList() {
    const list = $("list");
    const items = visible();
    if (!items.length) {
      const msg = state.q.trim()
        ? `'${state.q.trim()}'에 맞는 스킬이 없습니다. 검색어를 지우거나 다른 분류를 골라 보세요.`
        : "이 분류에는 아직 스킬이 없습니다.";
      list.replaceChildren(el("li", { class: "empty", text: msg }));
      return;
    }
    list.replaceChildren(...items.map(rowFor));
  }

  function catLabel(it) {
    const col = colById[it.group];
    const c = col && it.category ? (col.categories || []).find((x) => x.id === it.category) : null;
    return c ? c.label : "";
  }

  function rowFor(it) {
    const open = state.open === it.name;
    const tags = [];
    if (KIND_TAG[it.kind] && !(it.imported && it.kind === "external")) tags.push(el("span", { class: "tag", text: KIND_TAG[it.kind] }));
    if (it.type_label) tags.push(el("span", { class: "tag", text: it.type_label }));
    if (it.badge) tags.push(el("span", { class: "tag", text: it.badge }));
    if (it.needs && it.needs.length) tags.push(el("span", { class: "tag need", text: "따로 필요한 것 있음" }));
    const u = it.usage;
    let use, when;
    if (it.imported) {
      use = el("div", { class: "use none" }, el("b", { text: it.license || "라이선스 미확인" }));
      when = el("div", { class: "when" }, [
        it.stars ? el("span", { text: "별 " + Number(it.stars).toLocaleString("ko-KR") }) : null,
        it.commercial ? el("span", { text: "상업 이용 " + it.commercial }) : null,
        catLabel(it) && (state.group === "all" || !state.category) ? el("span", { text: catLabel(it) }) : null,
      ]);
    } else {
      use = u.calls > 0
        ? el("div", { class: "use" }, [
            el("span", { class: "bar" }, el("i", { style: `width:${Math.max(4, Math.sqrt(u.calls / maxCalls) * 100).toFixed(1)}%` })),
            el("b", { text: u.calls + "회" }),
          ])
        : el("div", { class: "use none" }, el("b", { text: "사용 기록 없음" }));
      when = el("div", { class: "when" }, [
        it.added ? el("span", { text: "배운 날 " + day(it.added) }) : null,
        u.last ? el("span", { text: "최근 사용 " + day(u.last) }) : null,
      ]);
    }
    const head = el("button", {
      class: "row-head", type: "button", "aria-expanded": String(open), "aria-controls": "panel-" + it.name,
      onclick: () => { state.open = open ? null : it.name; history.replaceState(null, "", open ? location.pathname + location.search : "#" + it.name); renderList(); },
    }, [
      thumbFor(it, false),
      el("div", { class: "what" }, [
        el("div", { class: "name" }, [el("span", { class: "title", text: it.title }), el("span", { class: "id", text: it.name }), ...tags]),
        el("p", { class: "sum", text: it.summary }),
      ]),
      use, when,
    ]);
    const li = el("li", { class: "row" + (open ? " open" : ""), id: "row-" + it.name }, head);
    if (open) li.append(panelFor(it));
    return li;
  }

  function cmdBlock(label, getText, extras, note) {
    const code = el("code", { text: getText() });
    return el("div", { class: "cmd" }, [
      el("div", { class: "cmd-top" }, [el("span", { text: label }), ...(extras || [])]),
      el("div", { class: "cmd-box" }, [code, copyBtn(() => code.textContent)]),
      note ? el("p", { class: "cmd-note", text: note }) : null,
    ]);
  }
  function segFor(key, options, onChange) {
    return el("span", { class: "seg small", role: "group" }, options.map(([v, label]) => el("button", {
      type: "button", text: label, "aria-pressed": String(state[key] === v),
      onclick: () => { state[key] = v; store.set(key, v); onChange(); },
    })));
  }

  function linkList(it) {
    const out = [];
    const seen = new Set();
    const add = (label, url) => {
      if (!url || seen.has(url)) return;
      seen.add(url);
      out.push(el("a", { href: url, target: "_blank", rel: "noopener", text: label }));
    };
    if (it.source) add("원본: " + it.source.label, it.source.url);
    for (const l of it.links || []) add(l.label, l.url);
    return out;
  }
  function bundleNote(it) {
    const names = it.skills_in_zip || [];
    if (!names.length) return "스킬 형식(SKILL.md)이 아닌 묶음입니다. skills-packs 폴더에 풀어 두니, 안의 README를 따르세요.";
    const shown = names.slice(0, 6).join(", ") + (names.length > 6 ? ` 외 ${names.length - 6}개` : "");
    return `zip 안에서 SKILL.md가 있는 폴더 ${names.length}개를 모두 스킬로 설치합니다: ${shown}. 같은 이름의 폴더가 있으면 남겨 두고 설치합니다.`;
  }

  function getBlock(it) {
    const box = el("div", { class: "get" });
    const draw = () => {
      const kids = [el("h3", { text: "받기" })];
      if (it.zip) {
        const cmdOnly = it.kind === "command";
        const bundle = it.kind === "bundle";
        const agent = cmdOnly ? "claude" : state.agent;
        kids.push(cmdBlock("CLI에 시킬 말", () => sayFor(it.name, cmdOnly ? "명령어" : (bundle ? "스킬 묶음" : "스킬"))));
        kids.push(cmdBlock("직접 설치", () => installCmd(it.name, agent, state.os), [
          segFor("os", [["win", "Windows"], ["sh", "macOS·Linux"]], draw),
          cmdOnly ? null : segFor("agent", [["claude", "Claude Code"], ["codex", "Codex"]], draw),
        ], cmdOnly ? "명령어는 Claude Code의 commands 폴더에 놓입니다."
          : bundle ? bundleNote(it)
          : "같은 이름의 폴더가 있으면 이름을 바꿔 남겨 두고 설치합니다."));
        kids.push(el("p", { class: "links" }, [
          el("a", { href: it.zip.path, download: "", text: `zip 받기 (${size(it.zip.bytes)})` }),
          it.entry ? el("a", { href: it.raw_base + it.entry, target: "_blank", rel: "noopener", text: it.entry + " 원문" }) : null,
          ...linkList(it),
        ]));
      } else if (it.kind === "external") {
        if (it.install && it.install.length) {
          kids.push(cmdBlock("원본에서 설치하는 명령", () => it.install.join("\n"), null,
            "이 창고에는 파일이 없습니다. 원본 저장소에서 받습니다."));
        } else {
          kids.push(el("p", { class: "cmd-note", text: "이 창고에는 파일이 없습니다. 아래 원본에서 받습니다." }));
        }
        const links = linkList(it);
        if (links.length) kids.push(el("p", { class: "links" }, links));
      } else {
        kids.push(el("p", { class: "cmd-note", text: "Claude 앱에 들어 있어 받을 필요가 없습니다." }));
      }
      box.replaceChildren(...kids);
      const pre = box.querySelector(".cmd-box code");
      if (it.kind === "external" && pre) pre.style.whiteSpace = "pre-wrap";
    };
    draw();
    return box;
  }

  function panelFor(it) {
    const p = it.preview || {};
    const hasVisual = p.type === "video" || p.type === "image";
    const u = it.usage;
    const facts = el("dl", { class: "facts" });
    const fact = (k, v) => { if (v) facts.append(el("dt", { text: k }), el("dd", { text: v })); };
    fact("지금 쓰는 곳", (it.agents || []).map((a) => AGENT_NAME[a] || a).join(", "));
    if (it.imported) {
      fact("분류", catLabel(it));
      fact("종류", it.type_label);
      fact("라이선스", it.license || "미확인");
      fact("상업 이용", it.commercial);
      fact("만드는 길", (it.routes || []).filter(Boolean).join(", "));
      fact("AI 사용", it.made_with);
      fact("필요한 것", it.requires);
      fact("반응", it.reach);
      fact("확인한 내용", it.checked);
      fact("주의", it.caution);
      fact("모은 날", it.added ? day(it.added) : "");
    } else {
      fact("배운 날", it.added ? day(it.added) + (it.updated && it.updated !== it.added ? `, 마지막으로 고친 날 ${day(it.updated)}` : "") : "");
      fact("사용", u.calls > 0 ? `${u.calls}회, 최근 ${day(u.last)}` : "대화 기록에 없음");
      if (it.zip) fact("크기", `파일 ${it.file_count}개, ${size(it.bytes)}`);
      fact("버전", it.version);
      fact("참고", it.note);
    }
    const points = [
      ...(it.good || []).map((t) => el("li", null, [el("b", { text: "좋은 점" }), t])),
      ...(it.limits || []).map((t) => el("li", null, [el("b", { text: "한계" }), t])),
    ];

    // 스킬에 적힌 설명이 영어뿐이면 한글 요약을 먼저 보이고 원문은 작게 둔다
    const original = it.description || "";
    const korean = /[가-힣]/.test(original);
    const info = el("div", { class: "info" }, [
      (korean ? original : it.summary) !== it.summary || it.zip ? el("p", { class: "desc", text: korean ? original : it.summary }) : null,
      !korean && original && original !== it.summary ? el("p", { class: "desc-src", text: "스킬에 적힌 설명: " + original }) : null,
      points.length ? el("ul", { class: "points" }, points) : null,
      facts,
      it.how ? el("p", { class: "how" }, [el("strong", { text: "쓰는 법 " }), it.how]) : null,
      it.needs && it.needs.length ? el("div", { class: "needs" }, [
        el("strong", { text: "이 창고가 주지 못하는 것 — 새 PC에서는 따로 갖춰야 합니다" }),
        el("ul", null, it.needs.map((n) => el("li", { text: n }))),
      ]) : null,
      getBlock(it),
      it.zip && it.files.length > 1 ? el("details", { class: "files" }, [
        el("summary", { text: `파일 ${it.file_count}개 보기` }),
        el("ul", null, it.files.map((f) => el("li", null, [
          el("a", { href: it.raw_base + f.path, target: "_blank", rel: "noopener", text: f.path }), el("span", { text: size(f.bytes) }),
        ]))),
      ]) : null,
    ]);

    let visual = null;
    if (p.type === "video") {
      const v = el("video", { src: p.src, poster: p.poster, muted: true, loop: true, playsinline: true, preload: "metadata", "aria-label": it.title + " 예시 영상" });
      v.muted = true;
      v.addEventListener("click", () => (v.paused ? v.play() : v.pause()));
      if (!reduceMotion) v.autoplay = true;
      visual = el("div", { class: "visual" }, [v, el("p", { class: "hint", text: "이 스킬로 만든 예시(소리 없음). 누르면 멈춥니다." })]);
    } else if (p.type === "image") {
      visual = el("div", { class: "visual" }, [el("img", { src: p.src, alt: it.title + " 예시" }), el("p", { class: "hint", text: "이 스킬로 만든 예시" })]);
    }

    const panel = el("div", { class: "panel", id: "panel-" + it.name }, [
      el("div", { class: "panel-grid" + (hasVisual ? " has-visual" : "") }, [visual, info]),
    ]);
    if (it.zip && it.entry) panel.append(docFor(it, !hasVisual));
    return panel;
  }

  function docFor(it) {
    const body = el("div", { class: "doc-body md", text: "문서를 불러오는 중…" });
    const more = el("button", { class: "doc-more", type: "button", text: "문서 전체 펼치기" });
    const doc = el("div", { class: "doc" }, [
      el("div", { class: "doc-head" }, [el("span", { text: it.entry + " 미리보기" })]),
      body, more,
    ]);
    more.addEventListener("click", () => {
      const all = doc.classList.toggle("all");
      more.textContent = all ? "문서 접기" : "문서 전체 펼치기";
    });
    fetch(it.raw_base + it.entry).then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then((t) => {
      body.innerHTML = md(t, it.raw_base);
      if (body.scrollHeight <= 430) { doc.classList.add("all"); more.remove(); }
    }).catch(() => { body.textContent = "문서를 불러오지 못했습니다. 위의 원문 링크로 열어 보세요."; more.remove(); });
    return doc;
  }

  function openItem(name, scroll) {
    const it = byName[name];
    if (!it) return;
    if (state.group !== "all" && it.group !== state.group) state.group = it.group;
    state.category = "";
    state.q = ""; $("q").value = "";
    state.open = name;
    history.replaceState(null, "", "#" + name);
    render();
    if (scroll) {
      const row = $("row-" + name);
      if (row) row.scrollIntoView({ behavior: reduceMotion || scroll === "now" ? "auto" : "smooth", block: "start" });
    }
  }

  function render() { renderControls(); renderPacks(); renderList(); }

  // ---------- 시작 ----------
  $("say").textContent = sayAll();
  document.querySelector("[data-copy-from=say]").addEventListener("click", (e) => copyText($("say").textContent, e.currentTarget));
  $("sorts").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-sort]");
    if (b) { state.sort = b.dataset.sort; render(); }
  });
  $("q").addEventListener("input", (e) => { state.q = e.target.value; state.open = null; renderPacks(); renderList(); });
  $("cats").addEventListener("change", (e) => { state.category = e.target.value; state.open = null; renderList(); });

  fetch("catalog.json", { cache: "no-cache" }).then((r) => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then((data) => {
    cat = data;
    byName = Object.fromEntries(cat.items.map((it) => [it.name, it]));
    maxCalls = Math.max(1, ...cat.items.map((it) => it.usage.calls));
    cat.items.forEach((it, i) => { it._i = i; });
    const cols = (cat.collections || []).filter((c) => c.count > 0);
    colById = Object.fromEntries(cols.map((c) => [c.id, c]));
    GROUPS = cols.map((c) => ({ id: c.id, label: c.title, count: c.count }))
      .concat([{ id: "all", label: "전체", count: cat.items.length }]);
    if (!colById[state.group]) state.group = GROUPS[0].id;
    const built = (cat.site.built_at || "").slice(0, 10);
    $("foot").replaceChildren(
      `${cat.site.title} v${cat.site.version}, ${built} 갱신. CLI가 읽는 안내는 `,
      el("a", { href: "llms.txt", text: "llms.txt" }), ", 전체 목록은 ",
      el("a", { href: "catalog.json", text: "catalog.json" }), "에 있습니다.",
    );
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && byName[h]) openItem(h, "now"); else render();
  }).catch(() => {
    $("list").replaceChildren(el("li", { class: "empty", text: location.protocol === "file:"
      ? "파일로 바로 열면 목록을 읽지 못합니다. 서버로 연 주소(http://…)에서 열어 주세요."
      : "목록(catalog.json)을 불러오지 못했습니다. 빌드가 끝났는지 확인해 주세요." }));
  });
  window.addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h && byName[h] && state.open !== h) openItem(h, true);
  });
})();
</script>
</body>
</html>
